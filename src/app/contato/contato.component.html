<div id="background" class="paddingTopAndBottom">
  <section id="Contato">
    <div class="titulos">
      <h2>Fale Conosco</h2>
      <h1>Solicite um Orçamento</h1>
    </div>
  </section>
  <div class="form-container">
    <form class="form-grid">
      <div class="form-group">
        <label class="required">Nome</label>
        <input type="text" [(ngModel)]="nome" name="nome" required />
      </div>

      <div class="form-group">
        <label>Empresa</label>
        <input type="text" [(ngModel)]="empresa" name="empresa" />
      </div>

      <div class="form-group">
        <label class="required">Telefone</label>
        <input type="tel" [(ngModel)]="telefone" name="telefone" required />
      </div>

      <div class="form-group">
        <label>CC</label>
        <input type="email" [(ngModel)]="email" name="email"/>
      </div>

      <div class="form-group" style="grid-column: span 2">
        <label class="required">Mensagem</label>
        <textarea required [(ngModel)]="mensagem" name="mensagem"></textarea>
      </div>

      <button type="button" class="submit-button" (click)="enviarEmail()">
        Enviar
      </button>
    </form>
  </div>
</div>
